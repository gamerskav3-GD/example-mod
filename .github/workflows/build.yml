name: Build Mod
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: geode-sdk/build-geode-mod@main
        id: build
        with:
          target: Android32
      - uses: actions/upload-artifact@v4
        with:
          name: My mod
          path: ${{ steps.build.outputs.build-output }}
